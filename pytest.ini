[pytest]
# `settings_test`, not `config.settings`: the site's own settings name a MySQL
# database no developer machine here can create. That module is `config.settings`
# with a database the suite can build, and it explains the trade in full.
DJANGO_SETTINGS_MODULE = settings_test
python_files = tests.py test_*.py *_tests.py
# Named explicitly so discovery does not walk `frontend/`, `node_modules/` or a
# virtualenv looking for test modules.
testpaths = companies config pipeline products scraping users
